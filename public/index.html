<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COTRAMI | Painel</title><style>
:root{font-family:system-ui,Arial;background:#f1f5f9;color:#15253c}*{box-sizing:border-box}body{margin:0}header{background:#163554;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}main{max-width:1080px;margin:25px auto;padding:0 16px}.card{background:white;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 3px 12px #15253c12}h1{font-size:23px;margin:0}h2{font-size:19px;margin:0 0 14px}input,select,button{font:inherit;padding:10px;border:1px solid #cad5e1;border-radius:8px}input,select{width:100%;min-width:0}button{background:#1267a7;color:white;border:0;cursor:pointer}button:hover{filter:brightness(.92)}button.secondary{background:#e5edf5;color:#19344e}button.danger{background:#a83232}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;align-items:end}label{display:grid;gap:5px;font-size:13px;font-weight:600}nav{display:flex;gap:8px;flex-wrap:wrap}nav button.active{background:#0e7b61}table{border-collapse:collapse;width:100%;min-width:520px}td,th{text-align:left;border-bottom:1px solid #e2e8f0;padding:10px;font-size:14px}.scroll{overflow:auto}.hidden{display:none!important}.muted{color:#64748b}#alert{padding:10px;border-radius:8px;display:none;background:#fff1d6}#alert.show{display:block}#logout{background:#334b62}#login{max-width:430px;margin:55px auto}small{color:#64748b}
</style></head><body><header><h1>🚌 COTRAMI — Administração</h1><button id="logout" class="hidden">Sair</button></header><main><div id="alert"></div><section id="login" class="card"><h2>Entrar</h2><form id="loginForm"><label>Login<input name="login" required autocomplete="username"></label><label>Senha<input name="senha" type="password" required autocomplete="current-password"></label><button>Entrar</button></form></section><section id="app" class="hidden"><div class="card"><strong id="welcome"></strong><p class="muted">Cadastre informações oficiais. As viagens são cadastradas por data.</p><nav id="tabs"><button data-tab="linhas" class="active">Linhas</button><button data-tab="veiculos">Veículos</button><button data-tab="viagens">Viagens / Escalas</button><button data-tab="usuarios" id="tabUsuarios" class="hidden">Cooperados</button></nav></div><div class="card"><h2 id="heading">Linhas</h2><form id="registroForm"></form></div><div class="card scroll"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div></section></main><script>
let token='',perfil='',tab='linhas',dados={linhas:[],veiculos:[],viagens:[],usuarios:[]};
const $=id=>document.getElementById(id), alertar=msg=>{ $('alert').textContent=msg;$('alert').className='show'; };
async function api(url,options={}){const r=await fetch('/api'+url,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...options.headers}});const j=await r.json();if(!r.ok)throw Error(j.erro||'Erro na requisição');return j;}
$('loginForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{const j=await api('/login',{method:'POST',body:JSON.stringify(d)});token=j.token;perfil=j.perfil;$('welcome').textContent='Olá, '+j.nome;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('tabUsuarios').classList.toggle('hidden',perfil!=='admin');$('alert').className='';await carregar();}catch(err){alertar(err.message)}};
$('logout').onclick=async()=>{try{await api('/logout',{method:'POST'})}catch{}location.reload()};
$('tabs').onclick=e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()}};
async function carregar(){try{for(const t of ['linhas','veiculos','viagens',...(perfil==='admin'?['usuarios']:[])])dados[t]=await api('/'+t);render()}catch(e){alertar(e.message)}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const field=(nome,label,type='text',options=null)=>`<label>${label}${options?`<select name="${nome}" required><option value="">Selecione</option>${options.map(x=>`<option value="${esc(x.id)}">${esc(x.nome||x.numero)}</option>`).join('')}</select>`:`<input name="${nome}" type="${type}" required ${type==='password'?'minlength="10"':''}>`}</label>`;
function render(){let form='',cols=[];$('heading').textContent={linhas:'Cadastrar linha',veiculos:'Cadastrar veículo',viagens:'Cadastrar viagem na escala',usuarios:'Cadastrar cooperado'}[tab];
if(tab==='linhas'){form=field('nome','Nome da linha')+field('origem','Origem')+field('destino','Destino');cols=['nome','origem','destino']}
if(tab==='veiculos'){form=field('numero','Número do carro')+field('descricao','Descrição / identificação');cols=['numero','descricao']}
if(tab==='viagens'){form=field('data','Data','date')+field('hora','Saída','time')+field('origem','Origem')+field('destino','Destino')+field('linhaId','Linha','text',dados.linhas)+field('veiculoId','Carro','text',dados.veiculos);cols=['data','hora','origem','destino','linhaId','veiculoId']}
if(tab==='usuarios'){form=field('nome','Nome')+field('login','Login')+field('senha','Senha','password')+'<label>Perfil<select name="perfil"><option value="cooperado">Cooperado</option><option value="admin">Administrador</option></select></label>';cols=['nome','login','perfil']}
$('registroForm').innerHTML=form+'<button type="submit">Salvar</button>';
$('head').innerHTML='<tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+(tab!=='usuarios'?'<th>Ações</th>':'')+'</tr>';
$('rows').innerHTML=dados[tab].map(x=>'<tr>'+cols.map(c=>{let v=x[c];if(c==='linhaId')v=dados.linhas.find(z=>z.id===v)?.nome||'?';if(c==='veiculoId')v=dados.veiculos.find(z=>z.id===v)?.numero||'?';return '<td>'+esc(v)+'</td>'}).join('')+(tab!=='usuarios'?`<td><button class="danger" data-id="${esc(x.id)}">Excluir</button></td>`:'')+'</tr>').join('');
}
$('registroForm').onsubmit=async e=>{e.preventDefault();const registro=Object.fromEntries(new FormData(e.target));try{await api('/'+tab,{method:'POST',body:JSON.stringify(registro)});$('alert').className='';await carregar();}catch(err){alertar(err.message)}};
$('rows').onclick=async e=>{const id=e.target.dataset.id;if(!id||!confirm('Excluir este registro?'))return;try{await api('/'+tab+'/'+encodeURIComponent(id),{method:'DELETE'});$('alert').className='';await carregar()}catch(err){alertar(err.message)}};
</script></body></html>
