<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COTRAMI | Painel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>🚌 COTRAMI — Administração</h1>
    <div class="topo-usuario hidden" id="usuarioBox">
      <span id="boasVindas"></span>
      <button type="button" class="btn btn-claro" id="sair">Sair</button>
    </div>
  </header>

  <main>
    <div id="aviso" class="aviso hidden" role="alert"></div>

    <!-- Login -->
    <section id="telaLogin" class="card login">
      <h2>Entrar</h2>
      <form id="formLogin" class="grade">
        <label>Login
          <input name="login" required autocomplete="username">
        </label>
        <label>Senha
          <input name="senha" type="password" required autocomplete="current-password">
        </label>
        <button type="submit" class="btn">Entrar</button>
      </form>
    </section>

    <!-- Painel -->
    <section id="telaPainel" class="hidden">
      <nav class="abas" id="abas" aria-label="Seções do painel"></nav>

      <div class="card">
        <div class="card-topo">
          <h2 id="tituloForm"></h2>
          <button type="button" class="btn btn-claro hidden" id="cancelarEdicao">Cancelar edição</button>
        </div>
        <p class="ajuda" id="ajudaForm"></p>
        <form id="formRegistro" class="grade"></form>
      </div>

      <div class="card">
        <div class="card-topo">
          <h2 id="tituloLista"></h2>
          <div class="filtros" id="filtros"></div>
        </div>
        <div class="tabela-scroll">
          <table>
            <thead id="cabecalho"></thead>
            <tbody id="linhasTabela"></tbody>
          </table>
        </div>
        <p class="vazio hidden" id="vazio"></p>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
